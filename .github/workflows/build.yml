name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.0'
      - name: Build (Loom)
        run: gradle build --no-daemon --stacktrace
      - name: Collect jar
        run: |
          mkdir -p build-work
          cp build/libs/fakemod-1.0.0.jar build-work/fakemod-1.0.0.jar
      - uses: actions/upload-artifact@v4
        with:
          name: fakemod
          path: build-work/fakemod-1.0.0.jar
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-build${{ github.run_number }}
          name: FakeMod 1.0.0 (build ${{ github.run_number }})
          files: build-work/fakemod-1.0.0.jar
      - name: Publish jar as base64 on dist branch
        run: |
          base64 -w0 build-work/fakemod-1.0.0.jar > /tmp/fakemod.jar.b64
          git config user.name github-actions
          git config user.email actions@github.com
          git checkout --orphan dist
          git rm -rf --quiet .
          cp /tmp/fakemod.jar.b64 fakemod.jar.b64
          git add fakemod.jar.b64
          git commit -q -m "dist build ${{ github.run_number }}"
          git push -f origin dist
